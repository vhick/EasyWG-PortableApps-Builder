name: EasyWG Portable - Build ZIP and Installer
on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Stable upstream version (latest or e.g. v0.2.9.2)'
        required: true
        default: latest
        type: string
permissions:
  contents: write
concurrency:
  group: easywg-portableapps-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify pinned shared action definitions
        run: python scripts/check-actions.py
      - name: Resolve exact stable upstream release, commit, binary and source
        id: upstream
        env:
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: python scripts/release.py resolve --version "$env:UPSTREAM_VERSION"
      - name: Check identical publisher-owned release in THIS repository
        id: existing
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check-existing.py
      - name: Describe skipped identical release
        if: steps.existing.outputs.skip == 'true'
        run: 'Write-Host "An identically tagged release already exists in this builder repository; build skipped."'
      - name: Stage official EasyWG application and safe Data layout
        if: steps.existing.outputs.skip != 'true'
        run: python scripts/release.py stage
      - name: Extract upstream executable icon
        if: steps.existing.outputs.skip != 'true'
        run: ./scripts/icons.ps1
      - name: Build genuine Windows x64 C++ PortableApps launcher
        if: steps.existing.outputs.skip != 'true'
        run: |
          & cmd.exe /d /c "scripts\build-launcher.cmd"
          if ($LASTEXITCODE -ne 0) { throw "Windows MSVC launcher build failed with exit code $LASTEXITCODE" }
      - name: Validate staging, PE binaries, provenance, and independent ZIP
        if: steps.existing.outputs.skip != 'true'
        run: python scripts/release.py validate
      - name: Build installer using pinned shared Package Builder
        if: steps.existing.outputs.skip != 'true'
        id: installer
        uses: vhick/Portable-Package-Builder@0112c35580e83b37eb8757ebcb949274e1631a04
        with:
          source-dir: build/EasyWGPortable
          output-dir: dist/installers
          engine: custom-nsis
          running-exe: EasyWGPortable.exe
          timeout-seconds: '900'
          package-revision: r1
      - name: Independently check installer PE, published checksum and embedded files
        if: steps.existing.outputs.skip != 'true'
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.installer-sha256 }}
        run: python scripts/verify-installer.py "$env:INSTALLER_FILE" "$env:INSTALLER_SHA256"
      - name: Generate release checksum report
        if: steps.existing.outputs.skip != 'true'
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
        run: |
          $zip = Get-ChildItem dist -Filter '*.zip' -File | Select-Object -First 1
          $installer = Get-Item -LiteralPath $env:INSTALLER_FILE
          $items = @($zip, $installer)
          foreach ($item in $items) {
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
            "$sha  $($item.Name)" | Out-File dist/SHA256SUMS.txt -Encoding utf8 -Append
            "- $($item.Name): ``$sha``" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
      - name: Dry-run universal Release Publisher
        if: steps.existing.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@cb64f86ac2d8c67506db5832de07f9ff58cbeaeb
        with:
          files: 'dist/*.zip;dist/installers/*.paf.exe'
          tag: ${{ steps.upstream.outputs.release_tag }}
          release-title: EasyWG PortableApps ${{ steps.upstream.outputs.version }} b1r1
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish validated ZIP and installer with universal Release Publisher
        if: steps.existing.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@cb64f86ac2d8c67506db5832de07f9ff58cbeaeb
        with:
          files: 'dist/*.zip;dist/installers/*.paf.exe'
          tag: ${{ steps.upstream.outputs.release_tag }}
          release-title: EasyWG PortableApps ${{ steps.upstream.outputs.version }} b1r1
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Preserve verified ZIP on installer/publisher failure only
        if: failure() && steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: easywg-verified-zip-after-failure
          path: dist/*.zip
          retention-days: 3
          if-no-files-found: ignore
